# PR-Agent configuration.
# Docs: https://docs.pr-agent.ai/usage-guide/configuration_options/
#
# This file is read from the repository root on every run, so the model and
# review rules stay reviewable in code review instead of being buried in the
# workflow. Secrets never live here: the provider keys are injected as env
# vars in .github/workflows/pr-agent.yml.
#
# Model chain: Gemini is primary; on quota exhaustion or provider failure
# PR-Agent falls back through the list in order. Groq's gpt-oss-120b is the
# official replacement for the retired llama-3.3-70b (shut down 2026-08-16)
# and answers fast on the developer tier, so it is tried first; OpenRouter's
# "free" router (free-tier models only) is the slow last resort.
# custom_model_max_tokens caps the output budget: without it, reasoning
# models on the chain burn the whole budget on thinking and return empty
# content with finish_reason "length".

[config]
model = "gemini/gemini-3.8-flash"
fallback_models = ["groq/openai/gpt-oss-120b", "openrouter/free"]
custom_model_max_tokens = 20000

[github_action_config]
auto_review = true
auto_describe = true
auto_improve = true

[pr_reviewer]
extra_instructions = """Review this repository against its own written rules, which live in docs/CODE_STYLE.md and docs/rules.md. The rules that carry real consequences:

1. No AGPL anywhere, including in exported ONNX model files. `ultralytics` is banned by name. An AGPL dependency in the shipped app obliges disclosure of the whole application's source, which kills a closed-source product. Flag any dependency or import that could carry this obligation.
2. Vue single-file components use `<script setup>` and JavaScript, never TypeScript. TypeScript is explicitly excluded from this stack.
3. Every public function carries a JSDoc doc block. A public symbol with no doc block is a defect, not a style nit.
4. Secrets must never reach a log sink. structlog redaction is mandatory at the logging call site.
5. The sole egress from this application is the Telegram notifier. Any other outbound network call is a defect.

Prioritise those five over formatting and style nits, and prefer flagging a missing test or a missing error path over anything cosmetic."""
